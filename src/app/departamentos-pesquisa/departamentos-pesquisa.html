<div class="card">
  <p-confirmdialog></p-confirmdialog>

  <h2>Pesquisa de Departamentos</h2>

  <div class="filtro-container">
    <input
      pInputText
      type="text"
      placeholder="Pesquisar por nome do departamento"
      [(ngModel)]="filtroNome"
      class="filtro-input"
    />

    <button pButton type="button" label="Pesquisar" icon="pi pi-search"></button>
  </div>

  <p-table [value]="departamentosFiltrados" [paginator]="true" [rows]="5" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Nome do Departamento</th>
        <th class="coluna-acoes">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-departamento>
      <tr>
        <td>{{ departamento.id }}</td>
        <td>{{ departamento.nomeDepartamento }}</td>
        <td>
          <button
            pButton
            type="button"
            icon="pi pi-pencil"
            class="p-button-text p-button-sm botao-editar"
            pTooltip="Editar"
            tooltipPosition="top"
            (click)="editarDepartamento(departamento.id)"
          ></button>

          <button
            pButton
            type="button"
            icon="pi pi-trash"
            class="p-button-text p-button-danger p-button-sm"
            pTooltip="Excluir"
            tooltipPosition="top"
            (click)="excluirDepartamento(departamento.id)"
          ></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="novo-container">
    <button
      pButton
      type="button"
      label="Novo Departamento"
      icon="pi pi-plus"
      (click)="abrirNovoDepartamento()"
    ></button>
  </div>

  <p-dialog
    [(visible)]="dialogVisivel"
    [modal]="true"
    [closable]="false"
    [draggable]="false"
    [resizable]="false"
    styleClass="dialog-departamento"
    [header]="tituloDialog"
  >
    <div>
      <label for="nomeDepartamento" class="dialog-label"> Nome do Departamento </label>
      <input
        id="nomeDepartamento"
        pInputText
        type="text"
        [(ngModel)]="nomeEmEdicao"
        class="dialog-input"
      />
    </div>

    <ng-template pTemplate="footer">
      <button
        pButton
        type="button"
        label="Cancelar"
        severity="secondary"
        (click)="fecharDialog()"
      ></button>
      <button
        pButton
        type="button"
        label="Salvar"
        class="botao-salvar"
        [disabled]="!nomeEmEdicao.trim()"
        (click)="salvarDepartamento()"
      ></button>
    </ng-template>
  </p-dialog>
</div>
